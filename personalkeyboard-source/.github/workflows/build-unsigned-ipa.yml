name: Build PersonalKeyboard IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare source
        run: |
          mkdir -p src
          cp -R personalkeyboard-source src/

      - name: Generate Xcode project
        working-directory: src/personalkeyboard-source
        run: xcodegen generate

      - name: Build app
        working-directory: src/personalkeyboard-source
        run: |
          xcodebuild \
            -project PersonalKeyboard.xcodeproj \
            -scheme PersonalKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: src/personalkeyboard-source
        run: |
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/PersonalKeyboard.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PersonalKeyboard-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalKeyboard-unsigned-ipa
          path: src/personalkeyboard-source/PersonalKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
