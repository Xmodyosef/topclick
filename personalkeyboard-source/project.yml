name: PersonalKeyboard
options:
  bundleIdPrefix: app.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ROLLING_VERSION: "0.2.9.1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PersonalKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared/Models/SharedKeyboardData.swift
    settings:
      base:
        PRODUCT_NAME: PersonalKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.PersonalKeyboard
        MARKETING_VERSION: "0.2.9"
        CURRENT_PROJECT_VERSION: 31
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMorning
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconEvening"
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: App/Config/PersonalKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.personal.PersonalKeyboard
    dependencies:
      - target: KeyboardExtension
        embed: true
      - sdk: Translation.framework
        weak: true
  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension/Sources
      - path: Shared/Models/SharedKeyboardData.swift
    # Explicit JSON files so XcodeGen copies them into KeyboardExtension.appex
    # (folder resource alone was missing from the built unsigned IPA).
    resources:
      - path: KeyboardExtension/Resources/emoji_catalog.json
      - path: KeyboardExtension/Resources/emoji_skin_map.json
      - path: KeyboardExtension/Resources/keyboard_layouts.json
      - path: KeyboardExtension/Resources/soft.caf
      - path: KeyboardExtension/Resources/thocky.caf
      - path: KeyboardExtension/Resources/creamy.caf
    settings:
      base:
        PRODUCT_NAME: KeyboardExtension
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.PersonalKeyboard.KeyboardExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "0.2.9"
        CURRENT_PROJECT_VERSION: 31
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KeyboardExtension/Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: KeyboardExtension/Config/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.personal.PersonalKeyboard
    dependencies:
      - sdk: Translation.framework
        weak: true
  NaqraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NaqraTests
    dependencies:
      - target: PersonalKeyboard
    settings:
      base:
        # Explicit product name: empty PRODUCT_NAME produced
        # PersonalKeyboard.app/PlugIns/.xctest and "Multiple commands produce" under xcodebuild test.
        PRODUCT_NAME: NaqraTests
        PRODUCT_BUNDLE_IDENTIFIER: app.personal.PersonalKeyboardTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PersonalKeyboard
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PersonalKeyboard.app/PersonalKeyboard"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PersonalKeyboard:
    build:
      targets:
        PersonalKeyboard: all
        KeyboardExtension: all
    test:
      config: Debug
      targets:
        - NaqraTests
