# XcodeGen spec — the project's source of truth. `xcodegen generate` rebuilds
# the .xcodeproj from this file; never hand-edit project.pbxproj.
# Delete the entitlement / Info.plist lines for services the app does not use —
# App Review rejects usage strings for capabilities the app never exercises.
name: MyApp
options:
  bundleIdPrefix: com.yourname          # final ID: com.yourname.MyApp — must be globally unique
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor   # Xcode 26+ new-project default
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""                       # set in .env.ship / passed by ship.sh
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"               # ship.sh overrides with a timestamp
    TARGETED_DEVICE_FAMILY: "1"                # iPhone only — halves screenshot/QA work
targets:
  MyApp:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: Sources/App/MyApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # com.apple.developer.healthkit.background-delivery: true   # only with HKObserverQuery background delivery
        com.apple.developer.weatherkit: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MyApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false   # skips the export-compliance question on every upload
        NSHealthShareUsageDescription: "MyApp reads your steps and sleep to show daily trends."
        NSHealthUpdateUsageDescription: "MyApp saves the water you log to Apple Health."
        NSLocationWhenInUseUsageDescription: "MyApp uses your location to show local weather."
        NSMotionUsageDescription: "MyApp counts steps and detects walks."
        NSMicrophoneUsageDescription: "MyApp records voice notes and transcribes them on your iPhone."
        NSSpeechRecognitionUsageDescription: "Voice notes are transcribed on your iPhone."
        NSCameraUsageDescription: "MyApp scans labels and documents."
        NSCalendarsWriteOnlyAccessUsageDescription: "MyApp adds your sessions to your calendar."
  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MyApp
schemes:
  MyApp:
    build:
      targets:
        MyApp: all
    test:
      targets: [MyAppTests]
