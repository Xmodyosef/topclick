name: IPA not required

# Companion to build-ipa.yml paths-ignore.
# When a PR only touches the ignored policy/skills/CI-guard paths, build-ipa is
# skipped entirely; this workflow still reports a green "build" check so required
# status contexts do not hang. Agent Guard and Security Review still run.
#
# GitHub rule: this workflow runs if ANY changed file matches paths below.
# If the PR also changes personalkeyboard-source/**, build-ipa runs for real.
on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - 'skills/**'
      - 'docs/**'
      - '.grok/**'
      - 'tests/**'
      - '.gitignore'
      - 'LICENSE'
      - 'LICENSE*'
      - '.github/CODEOWNERS'
      - '.github/workflows/agent-guard.yml'
      - '.github/workflows/security-review.yml'
      - '.github/workflows/ipa-not-required.yml'
      - '.github/workflows/remediation-baseline.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - 'skills/**'
      - 'docs/**'
      - '.grok/**'
      - 'tests/**'
      - '.gitignore'
      - 'LICENSE'
      - 'LICENSE*'
      - '.github/CODEOWNERS'
      - '.github/workflows/agent-guard.yml'
      - '.github/workflows/security-review.yml'
      - '.github/workflows/ipa-not-required.yml'
      - '.github/workflows/remediation-baseline.yml'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No application change
        run: |
          echo "Policy/skills/CI-guard/tests only."
          echo "Unsigned IPA build is intentionally not required for this change set."
          echo "Still required for personalkeyboard-source/**, .github/scripts/**, or build-ipa.yml."
