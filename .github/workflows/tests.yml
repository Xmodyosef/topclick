name: XCTest Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naqra-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  xctest:
    runs-on: macos-15
    # Soft gate: hang/timeout must not block merges of IPA-only fixes.
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Naqra source contracts
        run: python3 .github/scripts/validate_naqra.py personalkeyboard-source

      - name: Cache XcodeGen 2.46.0
        id: cache-xcodegen
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .ci-tools/xcodegen
          key: naqra-xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          DEST="${GITHUB_WORKSPACE}/.ci-tools/xcodegen"
          mkdir -p "$DEST"
          if [ ! -x "$DEST/xcodegen" ]; then
            brew install xcodegen
            SRC="$(command -v xcodegen)"
            test -x "$SRC"
            cp "$SRC" "$DEST/xcodegen"
            chmod +x "$DEST/xcodegen"
          fi
          echo "$DEST" >> "$GITHUB_PATH"
          hash -r || true
          xcodegen --version | grep -F "2.46.0"

      - name: Select Xcode with installed iOS simulator runtime
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          test -d "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version | grep -F "26.0.1"

      - name: Generate Project
        run: |
          set -euo pipefail
          cd personalkeyboard-source
          test -f project.yml
          xcodegen generate
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Run XCTest regression suite
        id: xctest
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cd personalkeyboard-source
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"

          echo "Available simulators:"
          xcrun simctl list devices available || true

          DEST_LINE=$(
            xcodebuild -showdestinations -project "$PROJECT" -scheme PersonalKeyboard 2>/dev/null \
              | grep "platform:iOS Simulator" | grep "OS:26.0.1" | grep "iPhone" | head -1 || true
          )
          if [ -z "$DEST_LINE" ]; then
            DEST_LINE=$(
              xcodebuild -showdestinations -project "$PROJECT" -scheme PersonalKeyboard 2>/dev/null \
                | grep "platform:iOS Simulator" | grep "iPhone" | head -1 || true
            )
          fi
          echo "Destination line: ${DEST_LINE:-<none>}"
          UDID=$(echo "$DEST_LINE" | sed -n 's/.*id:\([A-Fa-f0-9-]*\).*/\1/p')
          if [ -z "$UDID" ]; then
            echo "ERROR: no iOS Simulator destination found for PersonalKeyboard"
            exit 1
          fi
          echo "Using simulator UDID=$UDID"

          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          booted=0
          for _ in $(seq 1 45); do
            if xcrun simctl list devices | grep -F "$UDID" | grep -q "(Booted)"; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "ERROR: simulator $UDID did not reach Booted within 90s"
            xcrun simctl list devices || true
            exit 1
          fi
          echo "Simulator is Booted"

          xcodebuild test \
            -project "$PROJECT" \
            -scheme PersonalKeyboard \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath test-build \
            -resultBundlePath test-results.xcresult \
            -only-testing:NaqraTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Upload XCTest result bundle on failure
        if: failure() || steps.xctest.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xctest-results
          path: personalkeyboard-source/test-results.xcresult
          if-no-files-found: ignore
