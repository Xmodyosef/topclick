name: Build PersonalKeyboard IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          if [ -f personalkeyboard-source.zip ]; then
            unzip -o personalkeyboard-source.zip -d src
          elif [ -d personalkeyboard-source ]; then
            mkdir -p src
            cp -R personalkeyboard-source src/
          else
            echo "Source not found"
            exit 1
          fi
          ls -la src/personalkeyboard-source

      - name: Validate source and regression checks
        run: python3 .github/scripts/validate_naqra.py src/personalkeyboard-source

      - name: Verify app icon assets
        run: |
          ASSETS=src/personalkeyboard-source/Sources/ContainerApp/Assets.xcassets
          test -f "$ASSETS/AppIconMorning.appiconset/AppIconMorning.png"
          test -f "$ASSETS/AppIconEvening.appiconset/AppIconEvening.png"
          test -f "$ASSETS/MorningArtwork.imageset/MorningArtwork.png"
          test -f "$ASSETS/EveningArtwork.imageset/EveningArtwork.png"
          echo "Morning and evening icon assets are present"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src/personalkeyboard-source
        run: xcodegen generate

      - name: Build unsigned
        working-directory: src/personalkeyboard-source
        run: |
          xcodebuild \
            -project PersonalKeyboard.xcodeproj \
            -scheme PersonalKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Verify built app and alternate icon metadata
        working-directory: src/personalkeyboard-source
        run: |
          APP=$(find build -name "PersonalKeyboard.app" -type d | head -1)
          test -n "$APP"
          python3 "$GITHUB_WORKSPACE/.github/scripts/validate_built_app.py" "$APP"

      - name: Package IPA
        working-directory: src/personalkeyboard-source
        run: |
          APP=$(find build -name "PersonalKeyboard.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PersonalKeyboard-unsigned.ipa
          ls -lh PersonalKeyboard-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalKeyboard-unsigned-ipa
          path: src/personalkeyboard-source/PersonalKeyboard-unsigned.ipa
