name: Build PersonalKeyboard IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          if [ -f personalkeyboard-source.zip ]; then
            unzip -o personalkeyboard-source.zip -d src
          elif [ -d personalkeyboard-source ]; then
            mkdir -p src
            cp -R personalkeyboard-source src/
          else
            echo "Source not found"
            exit 1
          fi
          ls -la src/personalkeyboard-source

      - name: Place icon
        run: |
          ICON=src/personalkeyboard-source/AppIcon.png
          DEST_DIR=src/personalkeyboard-source/Sources/ContainerApp/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$DEST_DIR"
          if [ -f "$ICON" ]; then
            cp "$ICON" "$DEST_DIR/AppIcon.png"
            echo "✅ Icon placed"
          else
            echo "⚠️ AppIcon.png not found — skipping"
          fi
          cat > "$DEST_DIR/Contents.json" << 'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: src/personalkeyboard-source
        run: xcodegen generate

      - name: Build unsigned
        working-directory: src/personalkeyboard-source
        run: |
          xcodebuild \
            -project PersonalKeyboard.xcodeproj \
            -scheme PersonalKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: src/personalkeyboard-source
        run: |
          APP=$(find build -name "PersonalKeyboard.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PersonalKeyboard-unsigned.ipa
          ls -lh PersonalKeyboard-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalKeyboard-unsigned-ipa
          path: src/personalkeyboard-source/PersonalKeyboard-unsigned.ipa
