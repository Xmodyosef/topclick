name: Release Latest Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      confirm_replace:
        description: "Type YES to replace the previous GitHub Release after a successful build"
        required: true
        default: "NO"
      release_version:
        description: "Optional version; leave empty to use MARKETING_VERSION from project.yml"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.inputs.confirm_replace == 'YES' }}
    runs-on: macos-15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read and validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('personalkeyboard-source/project.yml').read_text()
          m = re.search(r'MARKETING_VERSION:\s*["\']?([^"\'\s]+)', text)
          if not m: raise SystemExit('MARKETING_VERSION not found')
          print(m.group(1))
          PY
          )
          if [ -n "$REQUESTED_VERSION" ]; then VERSION="$REQUESTED_VERSION"; fi
          [[ "$VERSION" =~ ^0\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          BUILD=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('personalkeyboard-source/project.yml').read_text()
          m = re.search(r'CURRENT_PROJECT_VERSION:\s*([0-9]+)', text)
          print(m.group(1) if m else '0')
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: personalkeyboard-source
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: personalkeyboard-source
        run: |
          PROJECT=$(find . -name '*.xcodeproj' | head -n 1)
          xcodebuild -project "$PROJECT" -scheme PersonalKeyboard -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

      - name: Verify built app bundle
        working-directory: personalkeyboard-source
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          python3 ../.github/scripts/validate_built_app.py "$APP"

      - name: Package exactly one IPA
        id: package
        working-directory: personalkeyboard-source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf Payload "Naqra-$VERSION.ipa"
          mkdir Payload
          find build/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 -exec cp -R {} Payload/ \;
          test "$(find Payload -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')" = 1
          zip -qr "Naqra-$VERSION.ipa" Payload
          shasum -a 256 "Naqra-$VERSION.ipa" | tee "Naqra-$VERSION.ipa.sha256"
          echo "ipa=personalkeyboard-source/Naqra-$VERSION.ipa" >> "$GITHUB_OUTPUT"

      - name: Verify bundle identifiers
        working-directory: personalkeyboard-source
        run: |
          test -f Sources/ContainerApp/Info.plist
          test -f Sources/KeyboardExtension/Info.plist
          plutil -lint Sources/ContainerApp/Info.plist Sources/KeyboardExtension/Info.plist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naqra-${{ steps.version.outputs.version }}-unsigned-ipa
          path: |
            personalkeyboard-source/Naqra-${{ steps.version.outputs.version }}.ipa
            personalkeyboard-source/Naqra-${{ steps.version.outputs.version }}.ipa.sha256

      - name: Replace previous GitHub Releases only after build passes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 1; fi
          git log -1 --pretty=format='Previous commit: %h%n%nChanges are documented in the commit and PR history.' > RELEASE_NOTES.md
          gh release create "$TAG" "personalkeyboard-source/Naqra-$VERSION.ipa" "personalkeyboard-source/Naqra-$VERSION.ipa.sha256" --title "نقرة — $VERSION" --notes-file RELEASE_NOTES.md
          # Keep the previous releases until the new release is successfully created.
          gh release list --limit 100 --json isDraft,isPrerelease,tagName --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' | while read old_tag; do
            [ -z "$old_tag" ] && continue
            [ "$old_tag" = "$TAG" ] && continue
            old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$old_tag" --jq '.id')
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$old_id"
          done
