name: Build Fresh Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Agent Folder
        run: rm -rf .agent

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project & Debug
        run: |
          cd personalkeyboard-source
          if [ -f project.yml ]; then 
            xcodegen generate 
          else 
            echo "ERROR: project.yml NOT FOUND!" 
          fi
          echo "--- LISTING FILES ---"
          ls -la
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Found Project: $PROJECT"
          echo "--- LISTING SCHEMES ---"
          xcodebuild -list -project "$PROJECT"

      - name: Build App
        run: |
          cd personalkeyboard-source
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          # محاولة استخدام اسم الـ Scheme الصحيح
          xcodebuild -project "$PROJECT" -scheme "PersonalKeyboard" -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify built app bundle
        working-directory: personalkeyboard-source
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          python3 ../.github/scripts/validate_built_app.py "$APP"

      - name: Create IPA
        run: |
          cd personalkeyboard-source
          mkdir -p Payload
          find build/Build/Products/Release-iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          zip -r PersonalKeyboard-unsigned-fresh.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fresh-Unsigned-IPA
          path: personalkeyboard-source/PersonalKeyboard-unsigned-fresh.ipa