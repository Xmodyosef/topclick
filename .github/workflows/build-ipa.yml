name: Build Fresh Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naqra-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Naqra source contracts
        run: python3 .github/scripts/validate_naqra.py personalkeyboard-source

      - name: Validate rolling version set
        working-directory: personalkeyboard-source
        run: python3 scripts/bump_version.py --check

      - name: Remove Agent Folder
        run: rm -rf .agent

      # Cache the XcodeGen binary only (not DerivedData / not test-build).
      - name: Cache XcodeGen 2.46.0
        id: cache-xcodegen
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .ci-tools/xcodegen
          key: naqra-xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          DEST="${GITHUB_WORKSPACE}/.ci-tools/xcodegen"
          mkdir -p "$DEST"
          if [ ! -x "$DEST/xcodegen" ]; then
            brew install xcodegen
            SRC="$(command -v xcodegen)"
            test -x "$SRC"
            cp "$SRC" "$DEST/xcodegen"
            chmod +x "$DEST/xcodegen"
          fi
          echo "$DEST" >> "$GITHUB_PATH"
          hash -r || true
          xcodegen --version | grep -F "2.46.0"

      - name: Select Xcode with installed iOS simulator runtime
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          test -d "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version | grep -F "26.0.1"

      - name: Generate Project & Debug
        run: |
          cd personalkeyboard-source
          if [ -f project.yml ]; then
            xcodegen generate
          else
            echo "ERROR: project.yml NOT FOUND!"
            exit 1
          fi
          echo "--- LISTING FILES ---"
          ls -la
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          echo "Found Project: $PROJECT"
          echo "--- LISTING SCHEMES ---"
          xcodebuild -list -project "$PROJECT"

      - name: Build App
        run: |
          cd personalkeyboard-source
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          xcodebuild -project "$PROJECT" -scheme "PersonalKeyboard" -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Ensure keyboard resources are embedded
        working-directory: personalkeyboard-source
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          APPEX="$APP/PlugIns/KeyboardExtension.appex"
          test -d "$APPEX"
          # Copy every file (not folders) to the appex root. Do not use type: folder
          # in project.yml — that path was missing from unsigned IPAs before.
          # Avoid `cp -R` and avoid piping into a while-subshell so failures abort.
          copied=0
          while IFS= read -r -d '' source; do
            test -s "$source"
            name=$(basename "$source")
            cp "$source" "$APPEX/$name"
            test -s "$APPEX/$name"
            copied=$((copied + 1))
            echo "embedded resource: $name"
          done < <(find KeyboardExtension/Resources -type f -print0)
          test "$copied" -ge 2
          test -s "$APPEX/emoji_catalog.json"
          test -s "$APPEX/keyboard_layouts.json"
          test -f "$APPEX/emoji_catalog.json"
          test -f "$APPEX/keyboard_layouts.json"
          echo "keyboard resources embedded count=$copied"

      - name: Verify built app bundle
        working-directory: personalkeyboard-source
        run: |
          # xcodebuild with CODE_SIGNING_ALLOWED=NO rewrites CODE_SIGN_ENTITLEMENTS
          # source files to empty plists; restore the committed entitlements first.
          git checkout HEAD -- \
            App/Config/PersonalKeyboard.entitlements \
            KeyboardExtension/Config/KeyboardExtension.entitlements
          wc -c App/Config/PersonalKeyboard.entitlements KeyboardExtension/Config/KeyboardExtension.entitlements
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          python3 ../.github/scripts/validate_built_app.py "$APP"

      - name: Create IPA
        run: |
          cd personalkeyboard-source
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" Payload/
          zip -r PersonalKeyboard-unsigned-fresh.ipa Payload
          shasum -a 256 PersonalKeyboard-unsigned-fresh.ipa > PersonalKeyboard-unsigned-fresh.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fresh-Unsigned-IPA
          path: |
            personalkeyboard-source/PersonalKeyboard-unsigned-fresh.ipa
            personalkeyboard-source/PersonalKeyboard-unsigned-fresh.ipa.sha256

      # XCTest lives in .github/workflows/tests.yml so simulator hangs never
      # delay or fail IPA delivery on this workflow.
