name: Build Fresh Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: naqra-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Naqra source contracts
        run: python3 .github/scripts/validate_naqra.py personalkeyboard-source

      - name: Validate rolling version set
        working-directory: personalkeyboard-source
        run: python3 scripts/bump_version.py --check

      - name: Remove Agent Folder
        run: rm -rf .agent

      - name: Install pinned XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version | grep -F "2.46.0"

      - name: Select Xcode with installed iOS simulator runtime
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          test -d "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version | grep -F "26.0.1"

      - name: Generate Project & Debug
        run: |
          cd personalkeyboard-source
          if [ -f project.yml ]; then
            xcodegen generate
          else
            echo "ERROR: project.yml NOT FOUND!"
            exit 1
          fi
          echo "--- LISTING FILES ---"
          ls -la
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          echo "Found Project: $PROJECT"
          echo "--- LISTING SCHEMES ---"
          xcodebuild -list -project "$PROJECT"

      - name: Run XCTest regression suite
        timeout-minutes: 12
        working-directory: personalkeyboard-source
        run: |
          set -euo pipefail
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"

          # Pick any available iPhone simulator by UDID (avoids hanging on a missing named destination).
          DEST_ID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"], text=True
          ))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime and "iphonesimulator" not in runtime.lower():
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name") or ""
                  if "iPhone" not in name:
                      continue
                  udid = device.get("udid")
                  if not udid:
                      continue
                  # Prefer iPhone 16, then any iPhone; prefer iOS 26 runtimes when present.
                  rank = (
                      0 if "iOS-26" in runtime or "iOS 26" in runtime else 1,
                      0 if "iPhone 16" in name else 1,
                      name,
                  )
                  candidates.append((rank, udid, name, runtime))
          if not candidates:
              print("No available iPhone simulator found", file=sys.stderr)
              sys.exit(1)
          candidates.sort(key=lambda item: item[0])
          _, udid, name, runtime = candidates[0]
          print(f"Selected simulator: {name} ({runtime}) -> {udid}", file=sys.stderr)
          print(udid)
          PY
          )

          # Boot (or wait until booted) before xcodebuild so the test step cannot stall forever.
          xcrun simctl bootstatus "$DEST_ID" -b || xcrun simctl boot "$DEST_ID" || true
          xcrun simctl bootstatus "$DEST_ID" -b

          # Host-app unit tests need ad-hoc signing on Simulator. Unsigned Release settings hang/install-fail.
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "PersonalKeyboard" \
            -destination "id=$DEST_ID" \
            -only-testing:NaqraTests \
            -derivedDataPath test-build \
            -resultBundlePath test-results.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=""

      - name: Build App
        working-directory: personalkeyboard-source
        run: |
          set -euo pipefail
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "PersonalKeyboard" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Ensure keyboard JSON resources are embedded
        working-directory: personalkeyboard-source
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          APPEX="$APP/PlugIns/KeyboardExtension.appex"
          test -d "$APPEX"
          for name in emoji_catalog.json keyboard_layouts.json arabic_lexicon.json; do
            SOURCE="Sources/KeyboardExtension/Resources/$name"
            test -s "$SOURCE"
            cp "$SOURCE" "$APPEX/$name"
            test -s "$APPEX/$name"
          done

      - name: Verify built app bundle
        working-directory: personalkeyboard-source
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          python3 ../.github/scripts/validate_built_app.py "$APP"

      - name: Create IPA
        working-directory: personalkeyboard-source
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" Payload/
          zip -r PersonalKeyboard-unsigned-fresh.ipa Payload
          shasum -a 256 PersonalKeyboard-unsigned-fresh.ipa > PersonalKeyboard-unsigned-fresh.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fresh-Unsigned-IPA
          path: |
            personalkeyboard-source/PersonalKeyboard-unsigned-fresh.ipa
            personalkeyboard-source/PersonalKeyboard-unsigned-fresh.ipa.sha256
