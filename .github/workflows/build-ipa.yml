name: Build Fresh Unsigned IPA

on:
  push:
    branches: [ main ]
    # Docs/skills only. Any other file (personalkeyboard-source/** including
    # Shared, Config, Resources, project.yml and scripts; .github/workflows/build-ipa.yml;
    # .github/scripts/**) still starts this workflow.
    paths-ignore:
      - '**/*.md'
      - 'skills/**'
      - 'docs/**'
      - '.grok/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'skills/**'
      - 'docs/**'
      - '.grok/**'
  # Manual builds are never filtered.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naqra-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate Naqra source contracts
        run: python3 .github/scripts/validate_naqra.py personalkeyboard-source

      - name: Validate rolling version set
        working-directory: personalkeyboard-source
        run: python3 scripts/bump_version.py --check

      - name: Remove Agent Folder
        run: rm -rf .agent

      # Cache XcodeGen binary only (not DerivedData / not test-build).
      # continue-on-error: cache service blips must never fail the IPA job.
      - name: Cache XcodeGen 2.46.0
        id: cache-xcodegen
        continue-on-error: true
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .ci-tools/xcodegen
          key: naqra-xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          DEST="${GITHUB_WORKSPACE}/.ci-tools/xcodegen"
          mkdir -p "$DEST"
          # Cache miss, corrupt restore, or cache step failure → brew fallback.
          if [ ! -x "$DEST/xcodegen" ] || ! "$DEST/xcodegen" --version 2>/dev/null | grep -qF "2.46.0"; then
            echo "XcodeGen cache miss or invalid; installing via Homebrew"
            brew install xcodegen
            SRC="$(command -v xcodegen)"
            test -x "$SRC"
            cp "$SRC" "$DEST/xcodegen"
            chmod +x "$DEST/xcodegen"
          else
            echo "XcodeGen restored from cache"
          fi
          # GITHUB_PATH only applies to *later* steps — always invoke via absolute path here.
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/xcodegen" --version | grep -F "2.46.0"

      - name: Select Xcode with installed iOS simulator runtime
        run: |
          XCODE_APP=/Applications/Xcode_26.0.1.app
          test -d "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version | grep -F "26.0.1"

      - name: Generate Project & Debug
        run: |
          cd personalkeyboard-source
          if [ -f project.yml ]; then
            xcodegen generate
          else
            echo "ERROR: project.yml NOT FOUND!"
            exit 1
          fi
          echo "--- LISTING FILES ---"
          ls -la
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          echo "Found Project: $PROJECT"
          echo "--- LISTING SCHEMES ---"
          xcodebuild -list -project "$PROJECT"

      - name: Build App
        run: |
          cd personalkeyboard-source
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          xcodebuild -project "$PROJECT" -scheme "PersonalKeyboard" -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Ensure keyboard resources are embedded
        working-directory: personalkeyboard-source
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          APPEX="$APP/PlugIns/KeyboardExtension.appex"
          test -d "$APPEX"
          # Copy every file (not folders) to the appex root. Do not use type: folder
          # in project.yml — that path was missing from unsigned IPAs before.
          # Avoid `cp -R` and avoid piping into a while-subshell so failures abort.
          copied=0
          while IFS= read -r -d '' source; do
            test -s "$source"
            name=$(basename "$source")
            cp "$source" "$APPEX/$name"
            test -s "$APPEX/$name"
            copied=$((copied + 1))
            echo "embedded resource: $name"
          done < <(find KeyboardExtension/Resources -type f -print0)
          test "$copied" -ge 3
          test -s "$APPEX/emoji_catalog.json"
          test -s "$APPEX/emoji_skin_map.json"
          test -s "$APPEX/keyboard_layouts.json"
          test -f "$APPEX/emoji_catalog.json"
          test -f "$APPEX/emoji_skin_map.json"
          test -f "$APPEX/keyboard_layouts.json"
          echo "keyboard resources embedded count=$copied"

      - name: Verify built app bundle
        working-directory: personalkeyboard-source
        run: |
          # xcodebuild with CODE_SIGNING_ALLOWED=NO rewrites CODE_SIGN_ENTITLEMENTS
          # source files to empty plists; restore the committed entitlements first.
          git checkout HEAD -- \
            App/Config/PersonalKeyboard.entitlements \
            KeyboardExtension/Config/KeyboardExtension.entitlements
          wc -c App/Config/PersonalKeyboard.entitlements KeyboardExtension/Config/KeyboardExtension.entitlements
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          python3 ../.github/scripts/validate_built_app.py "$APP"

      - name: Create IPA
        run: |
          set -euo pipefail
          cd personalkeyboard-source
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -type d -name 'PersonalKeyboard.app' -print -quit)
          test -n "$APP"
          cp -R "$APP" Payload/
          # Display name only. Do not rewrite MARKETING_VERSION or CURRENT_PROJECT_VERSION.
          ROLLING=$(python3 -c "import re, pathlib; t=pathlib.Path('project.yml').read_text(); m=re.search(r'(?m)^\\s+ROLLING_VERSION:\\s*[\"\']?([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)', t); assert m, 'ROLLING_VERSION missing'; print(m.group(1))")
          test -n "$ROLLING"
          IPA="PersonalKeyboard-${ROLLING}.ipa"
          zip -r "$IPA" Payload
          shasum -a 256 "$IPA" > "${IPA}.sha256"
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          echo "named ipa: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fresh-Unsigned-IPA
          path: |
            personalkeyboard-source/PersonalKeyboard-*.ipa
            personalkeyboard-source/PersonalKeyboard-*.ipa.sha256


      # Soft gate only: IPA is already uploaded above. Hang/timeout here does not
      # remove the artifact. Paths/xcodebuild flags unchanged from pre-split CI.
      - name: Run XCTest regression suite
        id: xctest
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd personalkeyboard-source
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"

          echo "Available simulators:"
          xcrun simctl list devices available || true

          DEST_LINE=$(
            xcodebuild -showdestinations -project "$PROJECT" -scheme PersonalKeyboard 2>/dev/null \
              | grep "platform:iOS Simulator" | grep "OS:26.0.1" | grep "iPhone" | head -1 || true
          )
          if [ -z "$DEST_LINE" ]; then
            DEST_LINE=$(
              xcodebuild -showdestinations -project "$PROJECT" -scheme PersonalKeyboard 2>/dev/null \
                | grep "platform:iOS Simulator" | grep "iPhone" | head -1 || true
            )
          fi
          echo "Destination line: ${DEST_LINE:-<none>}"
          UDID=$(echo "$DEST_LINE" | sed -n 's/.*id:\([A-Fa-f0-9-]*\).*/\1/p')
          if [ -z "$UDID" ]; then
            echo "ERROR: no iOS Simulator destination found for PersonalKeyboard"
            exit 1
          fi
          echo "Using simulator UDID=$UDID"

          # Avoid bootstatus -b (blocks until step timeout). Poll boot state instead.
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          booted=0
          for _ in $(seq 1 45); do
            if xcrun simctl list devices | grep -F "$UDID" | grep -q "(Booted)"; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "ERROR: simulator $UDID did not reach Booted within 90s"
            xcrun simctl list devices || true
            exit 1
          fi
          echo "Simulator is Booted"

          # Ad-hoc simulator signing is required for host-app unit tests.
          # CODE_SIGN_IDENTITY="" / CODE_SIGNING_ALLOWED=NO hangs install on
          # macos-15 (root cause of run 180 timeout after compile).
          xcodebuild test \
            -project "$PROJECT" \
            -scheme PersonalKeyboard \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath test-build \
            -resultBundlePath test-results.xcresult \
            -only-testing:NaqraTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Upload XCTest result bundle on failure
        if: steps.xctest.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xctest-results
          path: personalkeyboard-source/test-results.xcresult
          if-no-files-found: ignore
