name: Guardrails
on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore: [main, master, 'agent/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  block-direct-push:
    name: Block direct push to main
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - run: |
          echo "::error::Direct push to ${{ github.ref_name }} BLOCKED."
          exit 1
  branch-naming:
    name: Branch naming policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - run: |
          BR="${{ github.head_ref }}"
          if [[ ! "$BR" =~ ^agent/[a-z0-9._-]+-[a-z0-9._-]+-[0-9]{8}$ ]] && [[ ! "$BR" =~ ^(feature|fix|chore|docs|refactor|hotfix)/[a-z0-9._-]+$ ]]; then
            echo "::error::Branch '$BR' violates policy."
            exit 1
          fi
          echo "OK: $BR"
  secret-scan:
    name: Secret & credential scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          PATTERNS='BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN CERTIFICATE|\.p12|\.mobileprovision|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]+'
          if echo "$DIFF" | grep -E "$PATTERNS"; then
            echo "::error::Potential secret leaked."
            exit 1
          fi
  identity-guard:
    name: Protect fixed bundle IDs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff origin/${{ github.base_ref }}...HEAD | grep -E '^[+-]' | grep -v '^[+-][+-]' || true)
          if echo "$CHANGED" | grep -E 'app\.personal\.PersonalKeyboard|group\.app\.personal\.PersonalKeyboard'; then
            echo "::error::Identity bundle IDs locked."
            exit 1
          fi
  validate-naqra:
    name: validate_naqra.py
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          if [ -f .github/scripts/validate_naqra.py ]; then
            python3 .github/scripts/validate_naqra.py personalkeyboard-source
          fi
  protect-critical:
    name: Protect critical files
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          PROTECTED=$(git diff --name-only --diff-filter=M origin/${{ github.base_ref }}...HEAD | grep -E '^\.github/(workflows/(guardrails|auto-close-bad-pr|codeql|dependency-review)|CODEOWNERS)|^AGENTS\.md$' || true)
          if [ -n "$PROTECTED" ]; then
            echo "::error::Modifying critical files requires owner approval."
            exit 1
          fi
  guardrails-summary:
    name: Guardrails summary
    runs-on: ubuntu-latest
    needs: [branch-naming, secret-scan, identity-guard, validate-naqra, protect-critical]
    if: always() && github.event_name == 'pull_request'
    steps:
      - run: |
          if [[ "${{ needs.branch-naming.result }}" != "success" || "${{ needs.secret-scan.result }}" != "success" || "${{ needs.identity-guard.result }}" != "success" || "${{ needs.protect-critical.result }}" != "success" ]]; then
            exit 1
          fi
