name: Agent Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Validate agent work
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Generate immutable pre-remediation baseline
        run: python3 .github/scripts/create_remediation_baseline.py

      - name: Validate Naqra source contracts
        run: python3 .github/scripts/validate_naqra.py personalkeyboard-source

      - name: Validate skill routing
        run: python3 skills/skill-routing-integrity/scripts/verify_skill_links.py --root .

      - name: Run pytest regression suite
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q

      - name: Run repository guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tarfile
          from pathlib import Path

          base = os.environ.get('BASE_SHA') or ''
          head = os.environ.get('HEAD_SHA') or ''
          if not base or not head or base == '0000000000000000000000000000000000000000':
              # push without useful before-sha: compare to previous commit if possible
              try:
                  head = head or subprocess