name: Auto-close non-compliant PRs

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          if [[ ! "$BRANCH" =~ ^agent/ ]] \
             && [[ ! "$BRANCH" =~ ^(feature|fix|chore|docs|refactor|hotfix)/ ]]; then
            gh pr comment "$PR" -R "$REPO" --body "🚫 Branch \`$BRANCH\` violates naming policy. Allowed: \`agent/<name>-<task>-<YYYYMMDD>\` or \`feature/*\`."
            gh pr close "$PR" -R "$REPO"
          fi